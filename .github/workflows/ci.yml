name: CI & Self-Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    name: Run Tests & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          PYTHONPATH=. python -m pytest tests -v
      - name: Self SAST Audit Check
        run: |
          PYTHONPATH=. python app/presentation/cli/main.py . --format sarif --output results.sarif || true
