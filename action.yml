name: 'AI Augmented SAST Auditor'
description: 'Runs Bandit static security analysis with local GGUF AI false positive elimination and SARIF output.'
author: 'Elyyihz'

inputs:
  path:
    description: 'Path or file to scan'
    required: false
    default: '.'
  fail-on:
    description: 'Minimum severity to fail the job (LOW, MEDIUM, HIGH, CRITICAL)'
    required: false
    default: 'HIGH'
  output:
    description: 'Path to output SARIF report'
    required: false
    default: 'results.sarif'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install bandit pydantic pydantic-settings
    - name: Run AI SAST Scan
      shell: bash
      run: |
        PYTHONPATH=${{ github.action_path }} python ${{ github.action_path }}/app/presentation/cli/main.py ${{ inputs.path }} --format sarif --output ${{ inputs.output }} --fail-on ${{ inputs.fail-on }}
